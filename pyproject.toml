[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solvdock"
version = "0.1.0"
description = "Differentiable Mean-Field Solvation PDE + Torsion-Space Pose Optimizer"
readme = "solvdock_architecture.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solvdock*"]
